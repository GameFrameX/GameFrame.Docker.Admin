services:
  dockerapi:
    image: registry.cn-shenzhen.aliyuncs.com/gameframex/gameframex.docker.api:2025-01-09-14-07-05
    container_name: server.docker.admin
    ports:
      - "20900:8080"  # 将容器内的8080端口映射到主机的20900端口
    restart: always  # 设置容器重启策略
    environment:
      # API 鉴权密钥；未设置则鉴权关闭。从宿主机环境变量或 .env 文件读取，避免写入仓库
      - DOCKER_ADMIN_API_KEY=${DOCKER_ADMIN_API_KEY:-}
    networks: # 可选：定义一个网络
      - gameframex-network  # 可以自定义网络名称
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # 挂载 Docker socket
      - ./running/logs:/app/logs  # 挂载 日志目录
networks:
  gameframex-network: # 定义网络
    driver: bridge  # 网络驱动类型