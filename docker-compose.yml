services:
  dockerapi:
    image: registry.cn-shenzhen.aliyuncs.com/gameframex/gameframex.docker.api:2025-01-09-11-32-20
    ports:
      - "20900:8080"  # 将容器内的80端口映射到主机的20900端口
    restart: always  # 设置容器重启策略
    networks:  # 可选：定义一个网络
      - gameframex-network  # 可以自定义网络名称
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # 挂载 Docker socket 这个非常重要，可以让 Docker API 能够正常连接

networks:
  gameframex-network:  # 定义网络
    driver: bridge  # 网络驱动类型
